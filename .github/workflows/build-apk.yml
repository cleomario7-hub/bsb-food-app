name: Gerar APK BSB Food

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Permissões, ícones e ajustes do Android
        run: |
          python3 - <<'EOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CAMERA",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
          ]
          add = ""
          for perm in perms:
              if perm not in s:
                  add += '    <uses-permission android:name="%s" />\n' % perm
          s = s.replace("</manifest>", add + '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>')
          s = s.replace('<application', '<application android:usesCleartextTraffic="false"', 1) if "usesCleartextTraffic" not in s else s
          open(p, "w", encoding="utf-8").write(s)
          EOF
          # ícone do app: troca os ícones padrão pelos do BSB Food
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher*.png android/app/src/main/res/mipmap-$d/ic_launcher*.webp
            cp resources/mipmap/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done
          # cor do splash/tema
          sed -i 's/#FFFFFF/#E63919/I' android/app/src/main/res/values/styles.xml || true

      - name: Ajustes nativos (canal de notificacao, permissao e impressao)
        run: |
          set -e
          DIR=android/app/src/main/java/br/com/bsbfoods/app
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package br.com.bsbfoods.app;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          /**
           * BSB Food - MainActivity (Capacitor).
           *
           * 1) Cria o canal de notificação "corridas" (importância alta, som e vibração) assim que o app abre.
           *    É o mesmo ID usado pelo plugin BSB Notificações no servidor (android.notification.channel_id).
           * 2) Pede a permissão POST_NOTIFICATIONS (Android 13+) ao abrir o app.
           * 3) Expõe window.BSBPrint.print(html, titulo) para o site imprimir comprovantes/etiquetas
           *    pelo serviço de impressão do Android (o WebView não imprime sozinho).
           */
          public class MainActivity extends BridgeActivity {

              private static final String CHANNEL_ID = "corridas";
              private static final int REQ_NOTIF = 7301;

              // Mantém a referência do WebView de impressão até terminar (evita ser coletado antes).
              private WebView printWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  criarCanalCorridas();
                  pedirPermissaoNotificacao();
                  try {
                      getBridge().getWebView().addJavascriptInterface(new PrintBridge(), "BSBPrint");
                  } catch (Throwable ignored) {
                      // Sem a ponte, o site só mostra o comprovante em tela cheia (sem botão Imprimir).
                  }
              }

              private void criarCanalCorridas() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null || nm.getNotificationChannel(CHANNEL_ID) != null) return;

                  NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID, "Corridas e pedidos", NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("Avisos de novas corridas e pedidos");
                  ch.enableVibration(true);
                  ch.enableLights(true);
                  ch.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                  Uri som = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                  ch.setSound(som, new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build());
                  nm.createNotificationChannel(ch);
              }

              private void pedirPermissaoNotificacao() {
                  if (Build.VERSION.SDK_INT < 33) return;
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          == PackageManager.PERMISSION_GRANTED) return;
                  ActivityCompat.requestPermissions(this,
                          new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF);
              }

              /** Ponte JavaScript -> impressão do Android. */
              private class PrintBridge {
                  @JavascriptInterface
                  public void print(final String html, final String titulo) {
                      runOnUiThread(() -> {
                          final String nome = (titulo == null || titulo.isEmpty()) ? "Comprovante BSB Food" : titulo;
                          printWebView = new WebView(MainActivity.this);
                          printWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  if (pm == null) return;
                                  PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(nome);
                                  pm.print(nome, adapter, new PrintAttributes.Builder().build());
                              }
                          });
                          printWebView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                      });
                  }
              }
          }
          JAVA
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          meta = '<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="corridas" />'
          if "default_notification_channel_id" not in s:
              s = s.replace("</application>", "    " + meta + "\n    </application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("MainActivity.java e manifest atualizados")
          EOF
          grep -n "default_notification_channel_id" android/app/src/main/AndroidManifest.xml
          grep -n "class MainActivity" "$DIR/MainActivity.java"

      - name: Firebase (notificações)
        run: |
          python3 - <<'EOF'
          import json, sys, os
          if not os.path.exists("google-services.json"):
              print("::error::google-services.json não encontrado na raiz do repositório")
              sys.exit(1)
          d = json.load(open("google-services.json", encoding="utf-8"))
          pacotes = [c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])]
          if "br.com.bsbfoods.app" not in pacotes:
              print("::error::O google-services.json é de outro pacote: %s. Precisa ser br.com.bsbfoods.app" % pacotes)
              sys.exit(1)
          print("google-services.json ok:", pacotes)
          EOF
          cp google-services.json android/app/google-services.json

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BSB-Food-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
