<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSB Food</title>
<style>
  :root { --brand: #E63919; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fff7f4; color: #2b2b2b;
  }
  .logo {
    width: 96px; height: 96px; border-radius: 24px; background: var(--brand);
    color: #fff; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-weight: 800; line-height: 1; margin-bottom: 24px;
  }
  .logo b { font-size: 30px; }
  .logo small { font-size: 16px; letter-spacing: 1px; margin-top: 4px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #555; max-width: 320px; }
  button {
    border: 0; background: var(--brand); color: #fff; font-size: 17px; font-weight: 600;
    padding: 14px 32px; border-radius: 12px;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
  <div class="logo"><b>BSB</b><small>FOOD</small></div>
  <h1>Sem conexão</h1>
  <p>Não foi possível carregar o BSB Food. Verifique sua internet e tente novamente.</p>
  <button id="retry">Tentar novamente</button>
  <script>
    function go() { window.location.href = "https://www.bsbfoods.com.br"; }
    document.getElementById("retry").addEventListener("click", go);
    window.addEventListener("online", go);
  </script>
</body>
</html>
